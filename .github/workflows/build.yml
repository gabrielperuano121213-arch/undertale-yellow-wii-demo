
name: Compilar Undertale Yellow para Wii

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Compilar y empaquetar
        run: make package

      - name: Verificar resultado
        run: python3 tools/verificar.py apps/UndertaleYellow

      - name: Guardar resultado
        uses: actions/upload-artifact@v4
        with:
          name: UndertaleYellow-Wii
          path: apps/
